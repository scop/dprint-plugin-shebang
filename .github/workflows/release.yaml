name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: scop/common/force-color@main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sanity check tag vs version
        run: grep -xF "version = \"$GITHUB_REF_NAME\"" Cargo.toml
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --release --target wasm32-unknown-unknown
      - run: ln -s dprint_plugin_shebang.wasm target/wasm32-unknown-unknown/release/plugin.wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/wasm32-unknown-unknown/release/plugin.wasm

  github:
    name: GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write # for creating releases
    needs: build
    steps:
      - uses: scop/common/force-color@main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
      - run: sed "s/0\.0\.0/$GITHUB_REF_NAME/" deployment/schema.json > dist/schema.json
      - run: gh release create --generate-notes "$GITHUB_REF_NAME" dist/plugin.wasm dist/schema.json
        env:
          GH_TOKEN: ${{ github.token }}

  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for trusted publishing
    needs: build
    steps:
      - uses: scop/common/force-color@main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
      - run: sed "s/0\.0\.0/$GITHUB_REF_NAME/" deployment/npm/package.json > dist/package.json
      - run: cp -p README.md dist/
      - run: cd dist && npm publish
